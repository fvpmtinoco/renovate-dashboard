services:
  api:
    build: ./src/RenovateDashboard.App
    ports:
      - "5000:8080"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Static files only — no env_file needed (no server-side runtime)
  web:
    build: ./src/RenovateDashboard.Web
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
